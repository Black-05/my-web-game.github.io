<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181825">
  <title>小遊戲樂園</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body class="portal-page">
  <main class="portal">
    <header class="portal-header">
      <p class="eyebrow">MY WEB ARCADE</p>
      <h1>小遊戲樂園</h1>
      <p>挑一款遊戲，現在就開始！</p>
    </header>

    <section class="game-grid" aria-label="選擇遊戲">
      <a class="game-card tetris-card" href="tetris.html">
        <span class="game-icon" aria-hidden="true">🧱</span>
        <span class="game-card-copy">
          <strong>俄羅斯方塊</strong>
          <span>旋轉方塊、消除整行，挑戰最高分。</span>
          <span class="game-tag">經典益智</span>
        </span>
        <span class="game-arrow" aria-hidden="true">→</span>
      </a>

      <a class="game-card shooter-card" href="shooter.html">
        <span class="game-icon" aria-hidden="true">🚀</span>
        <span class="game-card-copy">
          <strong>星際戰機</strong>
          <span>閃避敵機並持續射擊，守住你的生命值。</span>
          <span class="game-tag">動作射擊</span>
        </span>
        <span class="game-arrow" aria-hidden="true">→</span>
      </a>

      <a class="game-card snake-card" href="snake.html">
        <span class="game-icon" aria-hidden="true">🐍</span>
        <span class="game-card-copy">
          <strong>貪食蛇</strong>
          <span>吃下食物讓蛇變長，小心不要撞到自己。</span>
          <span class="game-tag">反應挑戰</span>
        </span>
        <span class="game-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="portal-footer">使用鍵盤方向鍵遊玩 · 按下卡片即可進入遊戲</footer>
  </main>
</body>
</html>
